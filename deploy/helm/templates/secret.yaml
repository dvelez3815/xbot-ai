apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  X_BEARER_TOKEN: {{ .Values.secrets.xBearerToken | quote }}
  X_API_KEY: {{ .Values.secrets.xApiKey | quote }}
  X_API_SECRET: {{ .Values.secrets.xApiSecret | quote }}
  X_ACCESS_TOKEN: {{ .Values.secrets.xAccessToken | quote }}
  X_ACCESS_SECRET: {{ .Values.secrets.xAccessSecret | quote }}
  XQUIK_API_KEY: {{ .Values.secrets.xquikApiKey | quote }}
  XQUIK_ACCOUNT: {{ .Values.secrets.xquikAccount | quote }}
  AI_API_KEY: {{ .Values.secrets.aiApiKey | quote }}
